<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>__OXQL_TITLE__</title>
    <link rel="stylesheet" href="__OXQL_ASSET_BASE__/styles.css" />
    <script id="oxql-config" type="application/json">__OXQL_CONFIG__</script>
</head>
<body>
    <div class="app">
        <header class="topbar">
            <div class="brand">
                <span class="logo"></span>
                <span>__OXQL_TITLE__</span>
            </div>
            <button class="badge" id="engine-badge" title="GET /health · click for the health panel">engine …</button>
            <a class="studio-link" id="studio-link" target="_blank" rel="noopener noreferrer" hidden>Open OxQL Studio ↗</a>
            <div class="spacer"></div>
            <button class="badge" id="claims-badge" title="The decoded credential · click for every claim" hidden></button>
            <div class="token-field">
                <label for="token-input">Bearer</label>
                <input id="token-input" type="password" placeholder="paste token…" autocomplete="off" spellcheck="false" />
                <button class="icon" id="token-toggle" title="Show / hide token">👁</button>
                <button class="icon" id="token-clear" title="Clear token">✕</button>
            </div>
        </header>

        <section class="panel" id="claims-panel" hidden aria-label="Credential claims"></section>
        <section class="panel" id="health-panel" hidden aria-label="Engine health"></section>

        <div class="toolbar">
            <button class="primary" id="run-btn" title="POST /query, or /batch for a { queries: [] } document (Ctrl+Enter)">▶ Run</button>
            <button id="explain-btn" title="POST /explain: errors, steps, notes, owner queries and the compiled form (Ctrl+Shift+E)" hidden>Explain</button>
            <button id="indexes-btn" title="POST /explain with include: [&quot;indexes&quot;]: adds the index advisory" hidden>Explain + indexes</button>
            <button id="format-btn" title="Format JSON (Shift+Alt+F)">Format</button>
            <button id="reset-btn" title="Replace the scratch query with the starter query">Reset</button>
            <span class="hint" id="hint">One scratch query per service, saved in this browser · Ctrl+Enter to run</span>
        </div>

        <div class="split">
            <div class="editor-pane"><div id="editor"></div></div>
            <div class="results-pane">
                <div class="results-header">
                    <span class="status" id="status">Loading editor…</span>
                    <span class="spacer"></span>
                    <button class="icon" id="copy-result" title="Copy the raw JSON answer">Copy</button>
                </div>
                <div class="results-body" id="results"><span class="empty">Run or explain a query to see the answer.</span></div>
            </div>
        </div>
    </div>

    <script src="__OXQL_ASSET_BASE__/app.js"></script>
</body>
</html>
